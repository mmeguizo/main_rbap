name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Build backend
        run: |
          cd backend
          npm ci
          npm run build

      - name: Run backend tests
        run: |
          cd backend
          npm ci
          npm run test --silent

      - name: Build packages/ui
        run: |
          cd shadcn/vite-monorepo/packages/ui
          npm ci
          npm run build

      - name: Build web app
        run: |
          cd shadcn/vite-monorepo
          npm ci
          npm run build

      - name: Lint backend
        run: |
          cd backend
          npm run lint --silent

      - name: Lint frontend
        run: |
          cd shadcn/vite-monorepo
          npm run lint --silent
